instrument:
  id: ac-exaspim-01
  channels:
    '488':
      lasers: [488 nm]
      cameras: [vp-151mx]
      focusing_stages: []
  devices:
    vp-151mx:
      type: camera
      driver: voxel.devices.camera.vieworks.egrabber
      module: VieworksCamera
      init:
        id: MP151BBX029
      properties:
        exposure_time_ms: 4.4
        pixel_type: mono12
        line_interval_us: 20.0
        height_px: 5320
        width_px: 14192
        trigger:
          mode: on
          polarity: risingedge
          source: line0
        bit_packing_mode: msb
        binning: 1
        um_px: 0.748
    488 nm:
      type: laser
      driver: voxel.devices.laser.coherent.genesis_mx
      module: GenesisMXLaser
      color: blue
      init:
        id: A678976EP217
        wavelength: 488
        maximum_power_mw: 1000
    tiger controller:
      type: stage
      driver: tigerasi.tiger_controller
      module: TigerController
      init:
        com_port: COM3
      subdevices:
        m:
          type: scanning_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: m
            instrument_axis: v
          properties:
            # stage is open loop, SYNC triggers imaging
            # mode is off wrt TTL
            mode: off
            speed_mm_s: 1.0
            #backlash_mm: 0.0

            acceleration_ms: 200.0
        z:
          type: tiling_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: z
            instrument_axis: z
          properties:
            mode: off
            speed_mm_s: 1.0
            #backlash_mm: 0.0

            acceleration_ms: 200.0
        x:
          type: tiling_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: x
            instrument_axis: x
          properties:
            mode: off
            speed_mm_s: 1.0
            #backlash_mm: 0.004

            acceleration_ms: 200.0
        y:
          type: tiling_stage
          driver: voxel.devices.stage.asi.tiger
          module: TigerStage
          init:
            hardware_axis: y
            instrument_axis: y
          properties:
            mode: off
            speed_mm_s: 1.0
            #backlash_mm: 0.004

            acceleration_ms: 200.0
    pcie-6738:
      type: daq
      driver: voxel.devices.daq.ni
      module: NIDAQ
      init:
        dev: Dev1
      properties:
        tasks:
          ao_task:
            name: ao task
            ports:
              left tunable lens:
                port: ao1
                waveform: sawtooth
                device_max_volts: 10.0
                device_min_volts: 0.0
                parameters:
                  start_time_ms:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
                  end_time_ms:
                    channels:
                      '488': 141.0
                      '561': 141.0
                      '639': 141.0
                  amplitude_volts:
                    channels:
                      '488': 0.073
                      '561': 2.795
                      '639': 2.795
                  offset_volts:
                    channels:
                      '488': 2.44
                      '561': 5.39
                      '639': 5.62
                  cutoff_frequency_hz:
                    channels:
                      '488': 1000
                      '561': 1000
                      '639': 1000
              camera:
                port: ao2
                waveform: square wave
                device_max_volts: 5.0
                device_min_volts: 0.0
                parameters:
                  start_time_ms:
                    channels:
                      '488': 15.0
                      '561': 15.0
                      '639': 15.0
                  end_time_ms:
                    channels:
                      '488': 25.0
                      '561': 25.0
                      '639': 25.0
                  max_volts:
                    channels:
                      '488': 5.0
                      '561': 5.0
                      '639': 5.0
                  min_volts:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
              stage:
                port: ao0
                waveform: square wave
                device_max_volts: 5.0
                device_min_volts: 0.0
                parameters:
                  start_time_ms:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
                  end_time_ms:
                    channels:
                      '488': 5.0
                      '561': 5.0
                      '639': 5.0
                  max_volts:
                    channels:
                      '488': 5.0
                      '561': 5.0
                      '639': 5.0
                  min_volts:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
              488 nm:
                port: ao5
                waveform: square wave
                device_max_volts: 10.0
                device_min_volts: 0.0
                parameters:
                  start_time_ms:
                    channels:
                      '488': 10.0
                      '561': 10.0
                      '639': 10.0
                  end_time_ms:
                    channels:
                      '488': 130.0
                      '561': 130.0
                      '639': 130.0
                  max_volts:
                    channels:
                      '488': 5.0
                      '561': 0.0
                      '639': 0.0
                  min_volts:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
              561 nm:
                port: ao13
                waveform: square wave
                device_max_volts: 10.0
                device_min_volts: 0.0
                parameters:
                  start_time_ms:
                    channels:
                      '488': 10.0
                      '561': 10.0
                      '639': 10.0
                  end_time_ms:
                    channels:
                      '488': 130.0
                      '561': 130.0
                      '639': 130.0
                  max_volts:
                    channels:
                      '488': 0.0
                      '561': 10.0
                      '639': 0.0
                  min_volts:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
              639 nm:
                port: ao9
                waveform: square wave
                device_max_volts: 10.0
                device_min_volts: 0.0
                parameters:
                  start_time_ms:
                    channels:
                      '488': 10.0
                      '561': 10.0
                      '639': 10.0
                  end_time_ms:
                    channels:
                      '488': 130.0
                      '561': 130.0
                      '639': 130.0
                  max_volts:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 5.0
                  min_volts:
                    channels:
                      '488': 0.0
                      '561': 0.0
                      '639': 0.0
            timing:
              period_time_ms: 141.0
              rest_time_ms: 4.0
              retriggerable: on
              sample_mode: finite
              sampling_frequency_hz: 10000
              trigger_mode: on
              trigger_polarity: rising
              trigger_port: PFI0
          co_live_task:
            counters:
            - ctr0
            name: co live task
            timing:
              frequency_hz: 3.4
              output_port: PFI0
              trigger_mode: off
          co_acq_task:
            counters:
            - ctr0
            name: co acq task
            timing:
              frequency_hz: 6.8
              output_port: PFI0
              trigger_mode: on
              trigger_polarity: rising
              trigger_port: PFI2
    usb-6363:
      type: daq
      driver: voxel.devices.daq.ni
      module: NIDAQ
      init:
        dev: Dev2
      properties:
        tasks:
          co_task:
            counters:
            - ctr0
            name: co task
            timing:
              frequency_hz: 1
              output_port: PFI0
              trigger_mode: off